<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
</head>
<body>
    <h1>MathCSNotes</h1>
    <p>Welcome to MathCSNotes! This is a simple note-taking application for math and computer science notes.</p>
    <div id="mathlatex"></div>
    <button onclick="showNotes()">Show Notes</button>
    <div id="list"></div>
    <div id="note-view" style="white-space: pre-wrap;"></div>
    <h2> New Note  </h2>
    <input id = "new-title" placeholder = "Title (optional)">
    <br>
    <textarea id = "new-body" placeholder = "Body"></textarea>
    <br>
    <button onclick = "saveNote()">Save Note</button>
    <script>
     katex.render ("\\sum_{i=1}^n i = \\frac{n(n+1)}{2}", document.getElementById("mathlatex"));
     
     async function showNotes() {
        const notes = await pywebview.api.get_notes();
        const box = document.getElementById("list");
        box.innerHTML = "";
        for (const note of notes) {
            const p = document.createElement("p");
            p.textContent = note.title;
            p.onclick = () => showNote(note);
            p.style.cursor = "pointer";
            box.appendChild(p);
        }
     }

     function showNote(note) {
        const view = document.getElementById("note-view");
        view.innerHTML = "";

        const title = document.createElement("h2");
        title.textContent = note.title;
        view.appendChild(title);

        const body = document.createElement("div");
        body.textContent = note.body;
        view.appendChild(body);

        renderMathInElement(view, {
            delimiters: [
                {left: "$$", right: "$$", display: true},
                {left: "$", right: "$", display: false}
            ]
        });
     }

     async function saveNote() {
        const title = document.getElementById("new-title").value;
        const body = document.getElementById("new-body").value;
        if (body.trim() === "") {
            return;
        }

        await pywebview.api.create_note(title, body);
        
        document.getElementById("new-title").value = "";
        document.getElementById("new-body").value = "";

     showNotes();

    }

    


    </script>
</body>
</html>
