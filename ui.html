<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>MathCSNotes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Times New Roman', Times, serif;
            background: #f1f3f4;
            color: #202124;
        }
        header { padding: 8px 16px; background: #ffffff; border-bottom: 1px solid #dadce0; }
        header h1 { margin: 0; font-size: 1.4em; }
        .layout { display: flex; min-height: calc(100vh - 50px); }
        #sidebar { width: 240px; padding: 12px; background: #ffffff; border-right: 1px solid #dadce0; }
        #search { width: 100%; padding: 6px; margin-bottom: 4px; }
        .search-mode { display: block; font-size: 0.9em; color: #5f6368; margin-bottom: 8px; }
        #related { width: 220px; padding: 12px; background: #ffffff; border-left: 1px solid #dadce0; }
        #related p { margin: 0; padding: 6px 4px; cursor: pointer; border-radius: 4px; }
        #related p:hover { background: #e8f0fe; }
        #list p { margin: 0; padding: 6px 4px; cursor: pointer; border-radius: 4px; }
        #list p:hover, #list p.selected { background: #e8f0fe; }
        main { flex: 1; padding: 16px; }
        .page { background: #ffffff; border: 1px solid #dadce0; border-radius: 6px; padding: 16px; margin-bottom: 16px; }
        .hidden { display: none; }
        .meta { color: #5f6368; font-size: 0.9em; }
        #note-body { white-space: pre-wrap; }
        #run-output pre { background: #f8f9fa; padding: 8px; overflow-x: auto; white-space: pre-wrap; }
        #new-body { width: 100%; }
        .danger { color: #b3261e; }
    </style>
</head>
<body>
    <header>
        <h1>MathCSNotes</h1>
    </header>
    <div class="layout">
        <aside id="sidebar">
            <h3>Notes</h3>
            <input id="search" type="search" placeholder="Search notes" oninput="onSearchInput()">
            <label class="search-mode">
                <input id="by-meaning" type="checkbox" onchange="refreshList()"> Search by meaning
            </label>
            <div id="list"></div>
        </aside>

        <main>
            <p>Welcome to MathCSNotes! This is a simple note-taking application for math and computer science notes.</p>
            <div id="mathlatex"></div>

            <div id="note-page" class="page hidden">
                <h2 id="note-title"></h2>
                <p class="meta" id="note-meta"></p>
                <div id="note-body"></div>

                <p>
                    <label for="tags-input">Tags (comma separated):</label>
                    <input id="tags-input">
                    <button onclick="saveTags()">Save tags</button>
                </p>

                <p>
                    <button onclick="runCode()">Run code</button>
                    <button id="delete-button" onclick="askDelete()">Delete note</button>
                    <span id="delete-confirm" class="hidden">
                        <span class="danger">Delete this note for good?</span>
                        <button onclick="confirmDelete()">Yes, delete</button>
                        <button onclick="cancelDelete()">Cancel</button>
                    </span>
                </p>
                <div id="run-output"></div>
            </div>

            <div class="page">
                <h2>New Note</h2>
                <input id="new-title" placeholder="Title (optional)">
                <br>
                <textarea id="new-body" rows="10" cols="60" placeholder="Note body"></textarea>
                <br>
                <button onclick="saveNote()">Save Note</button>
            </div>
        </main>

        <aside id="related" class="hidden">
            <h3>Related notes</h3>
            <div id="related-list"></div>
        </aside>
    </div>

    <script>
        katex.render("\\sum_{i=1}^n i = \\frac{n(n+1)}{2}", document.getElementById("mathlatex"));

        // The id of the note currently shown, or null.
        let currentId = null;

        // $$...$$ must come before $...$ so "$$" isn't read as two empty "$".
        const MATH_OPTIONS = {
            delimiters: [
                {left: "$$", right: "$$", display: true},
                {left: "$", right: "$", display: false}
            ],
            throwOnError: false
        };

        // Searching by meaning embeds the query, so wait until typing pauses
        // instead of asking on every keystroke.
        let searchTimer = null;
        function onSearchInput() {
            clearTimeout(searchTimer);
            const delay = document.getElementById("by-meaning").checked ? 300 : 0;
            searchTimer = setTimeout(refreshList, delay);
        }

        // Answers can come back out of order; only the newest request may draw.
        let listRequest = 0;

        // Show the notes matching the search box (all notes if it's empty).
        // "Search by meaning" ranks notes by embedding instead of matching words.
        async function refreshList() {
            const request = ++listRequest;
            const text = document.getElementById("search").value.trim();
            const byMeaning = document.getElementById("by-meaning").checked;
            const notes = text === ""
                ? await pywebview.api.get_notes()
                : byMeaning
                    ? await pywebview.api.search_notes(text)
                    : await pywebview.api.search(text);
            if (request !== listRequest) {
                return;
            }

            const box = document.getElementById("list");
            box.innerHTML = "";
            if (notes.length === 0) {
                box.textContent = text === "" ? "No notes yet." : "No matches.";
                return;
            }
            for (const note of notes) {
                const p = document.createElement("p");
                p.textContent = note.title;
                if (note.id === currentId) {
                    p.classList.add("selected");
                }
                p.onclick = () => showNote(note);
                box.appendChild(p);
            }
        }

        function showNote(note) {
            currentId = note.id;
            document.getElementById("note-page").classList.remove("hidden");
            document.getElementById("note-title").textContent = note.title;
            document.getElementById("note-meta").textContent =
                "Last edited " + note.last_edited +
                (note.tags.length ? " · Tags: " + note.tags.join(", ") : "");
            document.getElementById("tags-input").value = note.tags.join(", ");
            document.getElementById("run-output").innerHTML = "";
            cancelDelete();

            const body = document.getElementById("note-body");
            body.textContent = note.body;
            renderMathInElement(body, MATH_OPTIONS);
            refreshList();
            refreshRelated();
        }

        // Fill the right-hand sidebar with the notes closest in meaning to the open one.
        async function refreshRelated() {
            const id = currentId;
            const notes = await pywebview.api.related_notes(id);
            if (id !== currentId) {
                return;  // a different note was opened while we waited
            }
            const box = document.getElementById("related-list");
            box.innerHTML = "";
            document.getElementById("related").classList.remove("hidden");
            if (notes.length === 0) {
                box.textContent = "No related notes yet.";
                return;
            }
            for (const note of notes) {
                const p = document.createElement("p");
                p.textContent = note.title;
                p.onclick = () => showNote(note);
                box.appendChild(p);
            }
        }

        function hideNote() {
            currentId = null;
            document.getElementById("note-page").classList.add("hidden");
            document.getElementById("related").classList.add("hidden");
        }

        async function saveNote() {
            const title = document.getElementById("new-title").value;
            const body = document.getElementById("new-body").value;
            if (body.trim() === "") {
                return;
            }
            const note = await pywebview.api.create_note(title, body);
            document.getElementById("new-title").value = "";
            document.getElementById("new-body").value = "";
            showNote(note);
        }

        async function saveTags() {
            const tags = document.getElementById("tags-input").value.split(",");
            const note = await pywebview.api.set_tags(currentId, tags);
            if (note) {
                showNote(note);
            }
        }

        // Deleting takes two clicks: "Delete note", then "Yes, delete".
        function askDelete() {
            document.getElementById("delete-button").classList.add("hidden");
            document.getElementById("delete-confirm").classList.remove("hidden");
        }

        function cancelDelete() {
            document.getElementById("delete-button").classList.remove("hidden");
            document.getElementById("delete-confirm").classList.add("hidden");
        }

        async function confirmDelete() {
            await pywebview.api.delete_note(currentId);
            hideNote();
            refreshList();
        }

        async function runCode() {
            const out = document.getElementById("run-output");
            out.textContent = "Running...";
            const results = await pywebview.api.run_code(currentId);
            out.innerHTML = "";
            if (results.length === 0) {
                out.textContent = "No code blocks. Write them between /start_python and /end_python (or /start_racket and /end_racket).";
                return;
            }
            results.forEach((result, i) => {
                const heading = document.createElement("h4");
                heading.textContent = "Block " + (i + 1) + " (" + result.language + ") output:";
                const pre = document.createElement("pre");
                pre.textContent = result.output;
                out.appendChild(heading);
                out.appendChild(pre);
            });
        }

        // pywebview.api only exists once pywebview says it's ready.
        window.addEventListener("pywebviewready", refreshList);
    </script>
</body>
</html>
